[package]
name = "menabig-tracker"
version = "1.0.0"
description = "MENA BIG Tracker — internal business proposals, contacts, agreements and CRM tracker"
authors = ["MENA Business Investment Group"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "menabig_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Remembers window size/position across quits/relaunches.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
# Proposal decks: a .pptx is a zip of XML parts (pptx.rs).
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
# Native error box when the database can't be backed up or upgraded at start
# (before any window exists). Already used by tauri-plugin-dialog.
rfd = { version = "0.16", default-features = false }

# Microsoft 365 / Graph integration (M365 upgrade). rustls instead of the
# default native-tls/OpenSSL backend — no system OpenSSL dependency to manage
# in the macOS bundle.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Waiting out Microsoft Graph throttling (Retry-After) between retries.
tokio = { version = "1", features = ["time"] }
# RSS/Atom parsing for Intelligence Watch's automatic feed ingestion —
# handles both formats uniformly so adding another source later doesn't need
# hand-rolled XML parsing.
feed-rs = "2"
# MS365 refresh tokens are stored in the macOS Keychain via the `security` CLI
# directly (see ms365/auth.rs) rather than the `keyring` crate — ad-hoc code
# signing (no paid Apple Developer ID) makes keyring's default Keychain ACL
# unstable across rebuilds, which the CLI's `-A` (any-app access) flag avoids.
# PKCE (RFC 7636) for the OAuth authorization-code flow — required for a
# desktop "public client" that cannot hold a confidential client secret.
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"


[target.'cfg(not(target_os = "macos"))'.dependencies]
# Stores the Microsoft 365 refresh token in Windows Credential Manager (macOS
# uses the Keychain CLI instead; see ms365/auth.rs).
keyring = { version = "3", features = ["windows-native"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
