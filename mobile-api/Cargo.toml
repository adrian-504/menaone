[package]
name = "menabig-mobile-api"
version = "0.1.0"
edition = "2021"
description = "Skeleton of the API the phone app will talk to. Runs on this Mac today, reading the desktop database; the same endpoints move to Azure when the cloud work happens."

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
