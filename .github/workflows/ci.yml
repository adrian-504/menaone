name: CI

# Run by hand from the Actions tab (or `gh workflow run CI`). The repository is
# public, so standard runners cost nothing, but a full run takes a while.
on:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Builds dist/, which the Rust crate embeds at compile time.
      - run: npm run build
      - run: npm test
      - run: cargo test
        working-directory: src-tauri
      # Focus rules (docs/ux-conventions.md): every view of the dev preview's
      # sample data, counted in headless Chrome (installed on macOS runners).
      - name: Focus check
        if: runner.os == 'macOS'
        run: |
          npx vite --port 1420 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:1420/ > /dev/null && break; sleep 1; done
          node scripts/focus-check.mjs

  windows-installer:
    name: Windows test installer
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: mena-one-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
