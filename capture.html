<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Capture</title>
</head>
<body style="background:transparent;margin:0;overflow:hidden">
  <div class="capture-bar">
    <span class="capture-icon" data-icon="bolt"></span>
    <input id="capture-input" class="capture-input" type="text" placeholder="Quick capture — Enter to save, Esc to dismiss" autocomplete="off" spellcheck="false" style="-webkit-appearance:none;appearance:none;border:none;outline:none;background:transparent;border-radius:0;padding:0;margin:0">
    <span id="capture-error-msg" class="capture-error-msg" style="display:none">Save failed — try again</span>
  </div>
  <script type="module" src="/src/capture.ts"></script>
</body>
</html>
